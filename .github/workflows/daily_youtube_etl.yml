name: Daily YouTube to BigQuery ETL

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. Install Python dependencies
        run: pip install -r requirements.txt

      - name: 4. Authenticate with Google Cloud BigQuery
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 5. Run YouTube API to BigQuery Pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BQ_PROJECT_ID: ${{ secrets.BQ_PROJECT_ID }}
        run: python youtube_channel_export.py
